[project]
name = "snowfastapi"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120,<1",
    "fastapi-swagger>=0.4.67,<0.5",
    "pydantic>=2.11,<3",
    "snowflake-connector-python>=3.16,<5",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
operator = ["pyyaml>=6,<7", "filelock>=3.18,<5"]
client = ["playwright>=1.51,<2"]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.14,<1", "ty>=0.0.86,<1", "pyyaml>=6,<7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
