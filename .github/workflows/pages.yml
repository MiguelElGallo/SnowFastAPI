name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.revision.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Build and check the manual
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          sed "s|^repo_url = .*|repo_url = \"$repo_url\"|" zensical.toml > .zensical-pages.toml
          uvx --from zensical==0.1.3 zensical build --config-file .zensical-pages.toml --clean --strict
          python3 scripts/check_site.py --repository-url "$repo_url"
      - name: Check the publishing revision
        id: revision
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the site
        if: steps.revision.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
